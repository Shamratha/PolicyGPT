# Render Blueprint - backend API (https://render.com/docs/blueprint-spec)
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: policygpt-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      # Clerk -> API keys -> "JWKS URL" (looks like https://xxxx.clerk.accounts.dev/.well-known/jwks.json)
      - key: CLERK_JWKS_URL
        sync: false
      # Your Vercel address, e.g. https://policygpt.vercel.app (comma-separate several)
      - key: CORS_ORIGINS
        sync: false
      # Emails or Clerk user ids allowed to add/delete schemes, comma separated
      - key: ADMIN_EMAILS
        sync: false
      # Optional: a real key enables GPT-4o answers and Hindi/Kannada replies
      - key: OPENAI_API_KEY
        value: sk-mock-key-for-now
