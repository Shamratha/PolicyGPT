version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: policygpt-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policygpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policygpt-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/policygpt
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-mock-replace-with-your-key}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL:-https://api.clerk.com/v1/jwks}
      - ENVIRONMENT=development
      - PORT=8000
    depends_on:
      - db
    volumes:
      - chroma_data:/app/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policygpt-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_placeholder}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-sk_test_placeholder}
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
